name: Build and release kernel and SDK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bs.ko for ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        kmi:
          - android12-5.10
          - android13-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    defaults:
      run:
        shell: bash
    env:
      KMI: ${{ matrix.kmi }}
      IMAGE: ghcr.io/ylarod/ddk:${{ matrix.kmi }}-20260828

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The job no longer runs inside the DDK image: a job-level container is
      # pulled before any step can run, and the 6.18 image alone does not fit in
      # the runner's default free space. Freeing disk first and then pulling
      # makes the build deterministic.
      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Build, validate and strip in the DDK container
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --rm --privileged -v "$PWD:/work" -w /work -e "KMI=$KMI" "$IMAGE" bash -lc '
            set -euo pipefail
            make -j"$(nproc)" KDIR="${KERNEL_SRC:?KERNEL_SRC is not set}"
            test -s bs.ko
            llvm-readelf -h bs.ko | grep -q "AArch64"
            llvm-readelf -p .modinfo bs.ko > /tmp/modinfo.txt
            grep -q "name=bs" /tmp/modinfo.txt
            grep -q "license=GPL" /tmp/modinfo.txt
            grep -q "vermagic=" /tmp/modinfo.txt
            echo "--- undefined symbols (first 40) ---"
            llvm-nm -u bs.ko | sed -n "1,40p"
            mkdir -p out
            output="bs-${KMI}.ko"
            cp bs.ko "out/$output"
            llvm-strip --strip-debug "out/$output"
            test -s "out/$output"
            cd out
            sha256sum "$output" > "$output.sha256"
          '

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: bs-kernel-${{ matrix.kmi }}
          path: |
            out/bs-${{ matrix.kmi }}.ko
            out/bs-${{ matrix.kmi }}.ko.sha256
          if-no-files-found: error
          retention-days: 30

  sdk:
    name: Build Android arm64 SDK and loader
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and install SDK
        run: |
          set -euo pipefail
          cmake -S . -B build/sdk -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release
          cmake --build build/sdk --parallel "$(nproc)"
          cmake --install build/sdk --prefix "$PWD/out/bskernel-sdk-arm64-v8a"

      - name: Verify installed SDK integration
        run: |
          set -euo pipefail
          cmake -S out/bskernel-sdk-arm64-v8a/examples -B build/consumer -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -Dbskernel_DIR="$PWD/out/bskernel-sdk-arm64-v8a/lib/cmake/bskernel"
          cmake --build build/consumer --parallel "$(nproc)"

      - name: Upload SDK, loader and calling example
        uses: actions/upload-artifact@v4
        with:
          name: bskernel-sdk-arm64-v8a
          path: out/bskernel-sdk-arm64-v8a/
          if-no-files-found: error
          retention-days: 30

  native-loader:
    name: Build native loader
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download kernel modules
        uses: actions/download-artifact@v4
        with:
          pattern: bs-kernel-*
          merge-multiple: true
          path: modules

      - name: Generate embedded module table
        run: |
          set -euo pipefail
          python3 sdk/tools/gen_embedded_modules.py sdk/tools/bs_native_modules.h modules
          ls -l sdk/tools/bs_native_modules.h

      - name: Build BSLoADERDriver with the NDK
        run: |
          set -euo pipefail
          cmake -S sdk -B build/native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static -DCMAKE_BUILD_TYPE=Release \
            -DBSKERNEL_BUILD_NATIVE_LOADER=ON \
            -DBSKERNEL_EMBEDDED_HEADER="$PWD/sdk/tools" \
            -DBSKERNEL_BUILD_TOOLS=OFF -DBSKERNEL_BUILD_EXAMPLE=OFF
          cmake --build build/native --target BSLoaderDriver --parallel "$(nproc)"
          mkdir -p out
          install -m 0755 build/native/BSLoaderDriver out/BSLoaderDriver.sh
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" --strip-debug out/BSLoaderDriver.sh
          file out/BSLoaderDriver.sh || true
          sha256sum out/BSLoaderDriver.sh > out/BSLoaderDriver.sh.sha256

      - name: Upload native loader
        uses: actions/upload-artifact@v4
        with:
          name: bskernel-native-loader
          path: |
            out/BSLoaderDriver.sh
            out/BSLoaderDriver.sh.sha256
          if-no-files-found: error
          retention-days: 30

  package:
    name: Package and publish release
    needs: [build, sdk, native-loader]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download SDK
        uses: actions/download-artifact@v4
        with:
          name: bskernel-sdk-arm64-v8a
          path: out/bskernel-arm64-v8a

      - name: Download native loader
        uses: actions/download-artifact@v4
        with:
          name: bskernel-native-loader
          path: out

      - name: Download kernel modules
        uses: actions/download-artifact@v4
        with:
          pattern: bs-kernel-*
          merge-multiple: true
          path: out/bskernel-arm64-v8a/modules


      - name: Verify modules and create distribution archive
        run: |
          set -euo pipefail
          for kmi in android12-5.10 android13-5.15 android14-6.1 android15-6.6 android16-6.12 android17-6.18; do
            (cd out/bskernel-arm64-v8a/modules && sha256sum --check "bs-$kmi.ko.sha256")
          done
          # Artifact ZIPs do not preserve executable permissions; the tarball does.
          chmod 755 out/bskernel-arm64-v8a/bin/bs_loader out/bskernel-arm64-v8a/bin/bs_example
          tar -C out/bskernel-arm64-v8a --exclude=./modules \
            -czf out/bskernel-sdk-arm64-v8a.tar.gz .
          tar -C out -czf out/bskernel-arm64-v8a.tar.gz bskernel-arm64-v8a
          cd out
          sha256sum bskernel-sdk-arm64-v8a.tar.gz > bskernel-sdk-arm64-v8a.tar.gz.sha256
          sha256sum bskernel-arm64-v8a.tar.gz > bskernel-arm64-v8a.tar.gz.sha256

      - name: Compress kernel release assets
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          for module in sorted(Path("out/bskernel-arm64-v8a/modules").glob("*.ko")):
              archive = Path("out") / f"{module.name}.zip"
              with ZipFile(archive, "w", ZIP_DEFLATED, compresslevel=9) as output:
                  output.write(module, arcname=module.name)
              print(f"{archive.name}: {module.stat().st_size} -> {archive.stat().st_size} bytes")
          PY
          cd out
          for archive in *.ko.zip; do
            sha256sum "$archive" > "$archive.sha256"
          done

      - name: Upload pull request distribution
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bskernel-arm64-v8a
          path: |
            out/bskernel-arm64-v8a.tar.gz
            out/bskernel-arm64-v8a.tar.gz.sha256
            out/BSLoaderDriver.sh
            out/BSLoaderDriver.sh.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Create draft release
        if: github.event_name != 'pull_request'
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Release identity matches enkernel: a UTC timestamp in the name and
          # <date>-<HHMMSS>-<run>-<attempt> as the tag, so every build is
          # uniquely addressable without any version file.
          release_name="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          release_tag="$(date -u '+%Y-%m-%d-%H%M%S')-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          release_id="$(
            gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$release_tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$release_name" \
              -f body="Built from ${GITHUB_SHA}. Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." \
              -F draft=true \
              --jq '.id'
          )"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload, verify and publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          files=(
            out/*.tar.gz
            out/*.tar.gz.sha256
            out/*.ko.zip
            out/*.ko.zip.sha256
            out/BSLoaderDriver.sh
            out/BSLoaderDriver.sh.sha256
          )
          gh release upload "$RELEASE_TAG" "${files[@]}"

          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --paginate --jq '.[] | [.name, .size] | @tsv')"
          for file in "${files[@]}"; do
            name="$(basename "$file")"
            expected_size="$(stat -c %s "$file")"
            actual_size="$(printf '%s\n' "$assets" | awk -v name="$name" '$1 == name {print $2}')"
            if [ "$expected_size" -le 0 ] || [ "$actual_size" != "$expected_size" ]; then
              echo "Release asset missing or size mismatch: $name" >&2
              exit 1
            fi
          done

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true >/dev/null

      - name: Delete incomplete release
        if: ${{ (failure() || cancelled()) && steps.release.outputs.release_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          # A failed response after publishing must not delete a complete release.
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')"
          if [ "$draft" = true ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true
          fi
